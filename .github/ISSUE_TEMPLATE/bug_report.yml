name: 问题反馈
description: 使用中遇到了报错、卡住、结果不对等情况
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。为了能定位问题，请尽量填完整。
        **注意：请不要粘贴你的私人经验内容、对话原文、用户名或本机完整路径。**

  - type: input
    id: skill_version
    attributes:
      label: 技能版本号
      description: 安装包文件名或技能里显示的版本号（例如 v1.0.0）
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: 你在哪个客户端上使用
      options:
        - Windows + Codex
        - Windows + 钉钉千问办公客户端
        - 钉钉内嵌千问
        - 手机端（钉钉内嵌千问 / WorkBuddy 等）
        - 其它（请在下面补充说明）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统版本
      description: 例如 Windows 11 23H2
      placeholder: Windows 11
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 你做了什么，第几步开始出问题
      placeholder: |
        1. 打开……
        2. 输入……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际现象
      description: 你看到的结果（有报错文字可以贴报错本身，但请去掉私人内容）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望现象
      description: 你认为本来应该怎样
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认以上内容不含我的私人经验、真实对话原文、账号或本机完整路径
          required: true
